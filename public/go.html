<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to ReCalc…</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="centered">
    <div class="container narrow">
        <h1>⚡ Redirecting to ReCalc…</h1>
        <div class="spinner" id="spinner"></div>
        <p class="status" id="status">Expanding compressed URL…</p>
        <div class="error hidden" id="error"></div>
        <pre class="url-preview hidden" id="preview"></pre>
    </div>

    <script type="module">
        import { expandUrl } from '/src/recalc.js';

        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');
        const spinnerEl = document.getElementById('spinner');
        const previewEl = document.getElementById('preview');

        async function main() {
            const token = window.location.hash.slice(1).trim();

            if (!token) {
                spinnerEl.classList.add('hidden');
                statusEl.textContent = '';
                errorEl.textContent = 'No token found. Use a URL like: /go#TOKEN';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const longUrl = await expandUrl(token);

                // Validate
                const u = new URL(longUrl);
                if (u.protocol !== 'http:' && u.protocol !== 'https:') {
                    throw new Error(`Refusing to redirect to: ${u.protocol}`);
                }

                statusEl.textContent = 'Redirecting…';
                previewEl.textContent = longUrl;
                previewEl.classList.remove('hidden');

                // Redirect
                window.location.replace(longUrl);
            } catch (e) {
                console.error('Expansion error:', e);
                spinnerEl.classList.add('hidden');
                statusEl.textContent = '';
                errorEl.textContent = e.message || 'Failed to expand URL';
                errorEl.classList.remove('hidden');
            }
        }

        main();
    </script>
</body>

</html>
